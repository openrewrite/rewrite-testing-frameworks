---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.hamcrest.ConsistentHamcrestMatcherImports
displayName: Use consistent Hamcrest matcher imports
description: Use consistent imports for Hamcrest matchers, and remove wrapping `is(Matcher)` calls ahead of further changes.
preconditions:
  - org.openrewrite.Singleton
tags:
  - testing
  - hamcrest
recipeList:
  # First change `is(..)` to `Matchers.is(..)` for consistent matching
  - org.openrewrite.java.testing.hamcrest.HamcrestFactoriesToMatchers

  # Then remove wrapping `is(Matcher)` calls such that further recipes will match
  - org.openrewrite.java.testing.hamcrest.RemoveIsMatcher
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.hamcrest.MigrateHamcrestToJUnit5
displayName: Migrate Hamcrest assertions to JUnit Jupiter
description: Migrate Hamcrest `assertThat(..)` to JUnit Jupiter `Assertions`.
preconditions:
  - org.openrewrite.Singleton
tags:
  - testing
  - hamcrest
  - junit
recipeList:
  # First change `is(..)` to `Matchers.is(..)` for consistent matching
  - org.openrewrite.java.testing.hamcrest.ConsistentHamcrestMatcherImports
  # Then replace `assertThat(String, boolean)` with `assertTrue(boolean, String)`
  - org.openrewrite.java.ReorderMethodArguments:
      methodPattern: org.hamcrest.MatcherAssert assertThat(java.lang.String, boolean)
      oldParameterNames: [reason, assertion]
      newParameterNames: [assertion, reason]
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.hamcrest.MatcherAssert assertThat(boolean, String)
      newMethodName: assertTrue
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.hamcrest.MatcherAssert assertTrue(boolean, String)
      fullyQualifiedTargetTypeName: org.junit.jupiter.api.Assertions
  - org.openrewrite.java.testing.hamcrest.HamcrestInstanceOfToJUnit5
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToJUnit5
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.hamcrest.MigrateHamcrestToAssertJ
displayName: Migrate Hamcrest assertions to AssertJ
description: Migrate Hamcrest `assertThat(..)` to AssertJ `Assertions`.
# the Hamcrest dependencies go in the cycle after the last use of Hamcrest is migrated
causesAnotherCycle: true
preconditions:
  - org.openrewrite.Singleton
tags:
  - testing
  - hamcrest
  - assertj
recipeList:
  # AssertJ, once the migration has written it, which is in the cycle after the migration of the first Hamcrest, so
  # that a project in which nothing can be migrated, such as one compiled for Java 7, doesn't get AssertJ
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.assertj
      artifactId: assertj-core
      version: 3.x
      onlyIfUsing: org.assertj..*
      acceptTransitive: true

  - org.openrewrite.java.testing.hamcrest.MigrateHamcrestToAssertJInJava8Sources
  # once nothing in the repository uses Hamcrest, which is in the cycle after the last Hamcrest is migrated
  - org.openrewrite.java.testing.hamcrest.RemoveUnusedHamcrestDependencies
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.hamcrest.MigrateHamcrestToAssertJInJava8Sources
displayName: Migrate Hamcrest assertions to AssertJ in sources compiled for Java 8 or later
description: >-
  Migrate Hamcrest `assertThat(..)` to AssertJ `Assertions` in the sources compiled for Java 8 or later. AssertJ 3
  requires Java 8, so sources compiled for an earlier Java keep Hamcrest.
preconditions:
  - org.openrewrite.java.testing.hamcrest.CompiledForJava8OrLater
tags:
  - testing
  - hamcrest
  - assertj
recipeList:
  # JUnit 4's deprecated `Assert.assertThat` and Hamcrest JUnit's `MatcherAssert` take Hamcrest matchers as
  # Hamcrest's own `MatcherAssert` does
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.junit.Assert assertThat(..)
      fullyQualifiedTargetTypeName: org.hamcrest.MatcherAssert
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.hamcrest.junit.MatcherAssert assertThat(..)
      fullyQualifiedTargetTypeName: org.hamcrest.MatcherAssert
  # AssertJ's `assertThat(null)` matches every overload of `assertThat`
  - org.openrewrite.java.testing.hamcrest.CastAmbiguousActualValue
  # An `ExpectedException` rule that takes Hamcrest matchers becomes AssertJ's `assertThatExceptionOfType(..)`
  - org.openrewrite.java.testing.hamcrest.MigrateHamcrestJUnitExpectedExceptionToAssertJ
  - org.openrewrite.java.testing.hamcrest.MigrateExpectedExceptionMatchersToAssertJ

  # Each pass migrates the matchers that the pass before it unwrapped from matchers nesting them, so that one
  # cycle migrates matchers nested several levels deep
  - org.openrewrite.java.testing.hamcrest.MigrateHamcrestMatchersToAssertJ
  - org.openrewrite.java.testing.hamcrest.MigrateHamcrestMatchersToAssertJ
  - org.openrewrite.java.testing.hamcrest.MigrateHamcrestMatchersToAssertJ
  - org.openrewrite.java.testing.hamcrest.InlineSatisfiesOfAssertions
  - org.openrewrite.java.testing.hamcrest.ShortenAssertJQualifiers
  - org.openrewrite.java.testing.hamcrest.QualifyUnmigratedHamcrestAssertions
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.hamcrest.MigrateHamcrestJUnitExpectedExceptionToAssertJ
displayName: Migrate Hamcrest JUnit's `ExpectedException` to AssertJ
description: >-
  Hamcrest JUnit's `ExpectedException` is a copy of JUnit 4's rule that takes Hamcrest matchers. Migrate its uses to
  AssertJ's `assertThatExceptionOfType(..)`, which also leaves the test independent of the JUnit 4 rule that removing
  Hamcrest JUnit would take off the classpath.
preconditions:
  - org.openrewrite.java.search.HasType:
      fullyQualifiedTypeName: org.hamcrest.junit.ExpectedException
tags:
  - testing
  - hamcrest
  - assertj
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.hamcrest.junit.ExpectedException
      newFullyQualifiedTypeName: org.junit.rules.ExpectedException
  - org.openrewrite.java.testing.junit5.ExpectedExceptionToAssertThrows
  - org.openrewrite.java.testing.assertj.JUnitAssertThrowsToAssertExceptionType
  # `ExpectedExceptionToAssertThrows` checks the cause of the exception with JUnit Jupiter's `assertInstanceOf`
  - org.openrewrite.java.testing.assertj.JUnitAssertInstanceOfToAssertThat
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.hamcrest.MigrateExpectedExceptionMatchersToAssertJ
displayName: Migrate an `ExpectedException` that takes Hamcrest matchers to AssertJ
description: >-
  JUnit 4's `ExpectedException` takes Hamcrest matchers for the exception, its message and its cause. Migrate the
  tests that pass it one to AssertJ's `assertThatExceptionOfType(..)`, so that no Hamcrest is left behind.
preconditions:
  - org.openrewrite.java.search.HasMethod:
      methodPattern: org.junit.rules.ExpectedException expect*(org.hamcrest.Matcher)
tags:
  - testing
  - hamcrest
  - assertj
recipeList:
  - org.openrewrite.java.testing.junit5.ExpectedExceptionToAssertThrows
  - org.openrewrite.java.testing.assertj.JUnitAssertThrowsToAssertExceptionType
  # `ExpectedExceptionToAssertThrows` checks the cause of the exception with JUnit Jupiter's `assertInstanceOf`
  - org.openrewrite.java.testing.assertj.JUnitAssertInstanceOfToAssertThat
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.hamcrest.MigrateHamcrestMatchersToAssertJ
displayName: Migrate Hamcrest matchers to AssertJ
description: >-
  Migrate Hamcrest `assertThat(..)` and `assumeThat(..)` to AssertJ, one level of nested matchers at a time. A matcher
  that nests other matchers becomes an AssertJ assertion whose requirements are Hamcrest assertions of the nested
  matchers, which the next pass migrates.
tags:
  - testing
  - hamcrest
  - assertj
recipeList:
  # Normalize Hamcrest imports to `org.hamcrest.Matchers` and remove wrapping `is(Matcher)` calls
  - org.openrewrite.java.testing.hamcrest.ConsistentHamcrestMatcherImports

  # Convert `assertThat(x, equalTo(Float.NaN))` to `assertThat(x).isNaN()`, as AssertJ's `isEqualTo(float)` compares with `==`
  - org.openrewrite.java.testing.hamcrest.HamcrestFloatingPointEqualityToAssertJ

  # Convert `assertThat(x, allOf(..))` to `assertThat(x).satisfies(..)` and `anyOf` to `satisfiesAnyOf`
  - org.openrewrite.java.testing.hamcrest.HamcrestOfMatchersToAssertJ

  # Convert `assertThat(x, hasProperty(..))` to `assertThat(x).hasFieldOrProperty(..)` / `hasFieldOrPropertyWithValue(..)`
  - org.openrewrite.java.testing.hamcrest.HamcrestHasPropertyToAssertJ

  # Convert `assertThat(x, everyItem(..))` to `assertThat(x).hasOnlyElementsOfType(..)` / `allSatisfy(..)`
  - org.openrewrite.java.testing.hamcrest.HamcrestEveryItemToAssertJ

  # Convert `assertThat(x, hasItem(Matcher))` to `assertThat(x).hasAtLeastOneElementOfType(..)` / `anySatisfy(..)`
  - org.openrewrite.java.testing.hamcrest.HamcrestHasItemMatcherToAssertJ

  # Convert `assertThat(x, is(value))` to `assertThat(x).isEqualTo(value)`
  - org.openrewrite.java.testing.hamcrest.HamcrestIsMatcherToAssertJ

  # Convert `assertThat(reason, boolean)` to AssertJ
  - org.openrewrite.java.testing.hamcrest.AssertThatBooleanToAssertJ

  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: comparesEqualTo
      assertion: isEqualTo
      argumentType: java.lang.String
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: comparesEqualTo
      assertion: isEqualByComparingTo

  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: lessThan
      assertion: isBefore
      argumentType: java.util.Date
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: lessThanOrEqualTo
      assertion: isBeforeOrEqualTo
      argumentType: java.util.Date
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: greaterThan
      assertion: isAfter
      argumentType: java.util.Date
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: greaterThanOrEqualTo
      assertion: isAfterOrEqualTo
      argumentType: java.util.Date

  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: lessThan
      assertion: isBefore
      argumentType: java.time.Instant
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: lessThanOrEqualTo
      assertion: isBeforeOrEqualTo
      argumentType: java.time.Instant
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: greaterThan
      assertion: isAfter
      argumentType: java.time.Instant
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: greaterThanOrEqualTo
      assertion: isAfterOrEqualTo
      argumentType: java.time.Instant

  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: equalTo
      assertion: isEqualTo
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: greaterThanOrEqualTo
      assertion: isGreaterThanOrEqualTo
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: greaterThan
      assertion: isGreaterThan
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: hasToString
      assertion: hasToString
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: lessThanOrEqualTo
      assertion: isLessThanOrEqualTo
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: lessThan
      assertion: isLessThan
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: notNullValue
      assertion: isNotNull
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: not
      assertion: isNotEqualTo
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: nullValue
      assertion: isNull
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: sameInstance
      assertion: isSameAs

  # Object Matchers
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: instanceOf
      assertion: isInstanceOf
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
      matcher: isA
      assertion: isInstanceOf

  # Array Matchers
  - org.openrewrite.java.testing.hamcrest.HamcrestMatcherToAssertJ:
