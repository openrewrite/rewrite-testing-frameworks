---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.mockito.ReplacePowerMockito
displayName: Replace PowerMock with raw Mockito
description: >-
  PowerMockito with raw Mockito; best executed as part of a Mockito upgrade. Repositories that use PowerMock features
  without a Mockito equivalent are left on PowerMock, with a comment on each such usage, rather than partially migrated.
preconditions:
  - org.openrewrite.Singleton
tags:
  - testing
  - mockito
recipeList:
  - org.openrewrite.java.testing.mockito.ReplacePowerMockitoIfFullySupported
  - org.openrewrite.java.testing.mockito.FlagUnsupportedPowerMockUsage
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.mockito.ReplacePowerMockitoIfFullySupported
displayName: Replace PowerMock with raw Mockito when all PowerMock usage can be migrated
description: >-
  Replaces PowerMock with raw Mockito, including the PowerMock dependencies, in repositories whose PowerMock usage can
  be migrated in full.
preconditions:
  - org.openrewrite.java.testing.mockito.HasOnlySupportedPowerMockUsage
tags:
  - testing
  - mockito
recipeList:
  - org.openrewrite.java.testing.mockito.ReplacePowerMockDependencies
  - org.openrewrite.java.testing.mockito.UpgradeMockitoCoreReplacingPowerMock
  - org.openrewrite.java.testing.mockito.ReplacePowerMockitoUsages
  - org.openrewrite.java.dependencies.RemoveDependency:
      groupId: org.powermock
      artifactId: powermock*
  - org.openrewrite.maven.RemoveManagedDependency:
      groupId: org.powermock
      artifactId: powermock*
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.mockito.UpgradeMockitoCoreReplacingPowerMock
displayName: Upgrade `mockito-core` along with the Mockito that replaces PowerMock
description: >-
  Upgrades an explicitly declared `mockito-core` to at least the Mockito 3.x that replaces the PowerMock Mockito API.
  An older `mockito-core` would otherwise take precedence over the one `mockito-inline` depends on, so that
  `Mockito.mockStatic` and `MockedStatic` do not resolve.
preconditions:
  - org.openrewrite.java.dependencies.search.RepositoryHasDependency:
      groupIdPattern: org.powermock
      artifactIdPattern: powermock-api-mockito*
tags:
  - testing
  - mockito
recipeList:
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.mockito
      artifactId: mockito-core
      newVersion: 3.x
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.mockito.ReplacePowerMockitoUsages
displayName: Replace PowerMock usages with Mockito
description: >-
  Replaces the PowerMock API, runners, rules and annotations used in Java sources with their Mockito counterparts, and
  PowerMock `Whitebox` with Java reflection. Build files are left unchanged.
tags:
  - testing
  - mockito
recipeList:
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: "@org.powermock.core.classloader.annotations.PowerMockIgnore"
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: "@org.powermock.core.classloader.annotations.SuppressStaticInitializationFor"
  - org.openrewrite.java.testing.mockito.PowerMockRunnerDelegateToRunWith
  - org.openrewrite.java.testing.mockito.PowerMockitoMockStaticToMockito
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.powermock.api.mockito.PowerMockito mockStatic(..)
      fullyQualifiedTargetTypeName: org.mockito.Mockito
      returnType: org.mockito.MockedStatic
  - org.openrewrite.java.testing.mockito.PowerMockitoDoStubbingToMockito
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.powermock.api.mockito.PowerMockito do*(..)
      fullyQualifiedTargetTypeName: org.mockito.Mockito
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.powermock.api.mockito.PowerMockito mock(..)
      fullyQualifiedTargetTypeName: org.mockito.Mockito
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.powermock.api.mockito.PowerMockito spy(..)
      fullyQualifiedTargetTypeName: org.mockito.Mockito
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.powermock.api.mockito.PowerMockito when(..)
      fullyQualifiedTargetTypeName: org.mockito.Mockito
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.powermock.api.mockito.PowerMockito verifyNoMoreInteractions(..)
      fullyQualifiedTargetTypeName: org.mockito.Mockito
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.powermock.api.mockito.PowerMockito verifyZeroInteractions(..)
      fullyQualifiedTargetTypeName: org.mockito.Mockito
  - org.openrewrite.java.testing.mockito.RemovePowerMockRule
  - org.openrewrite.java.testing.mockito.RemovePowerMockClassExtensions
  # Removes what PowerMockitoMockStaticToMockito leaves, such as `@PrepareForTest(fullyQualifiedNames = ...)`
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: "@org.powermock.core.classloader.annotations.PrepareForTest"
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: "@org.powermock.core.classloader.annotations.PrepareOnlyThisForTest"
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: "@org.powermock.core.classloader.annotations.PrepareEverythingForTest"
  - org.openrewrite.java.testing.mockito.PowerMockitoWhenNewToMockito
  - org.openrewrite.java.testing.mockito.PowerMockWhiteboxToJavaReflection
  - org.openrewrite.java.testing.mockito.CleanupPowerMockImports
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.mockito.PowerMockWhiteboxToJavaReflection
displayName: Replace PowerMock `Whitebox` with Java reflection
description: >-
  Replace `org.powermock.reflect.Whitebox` calls (`setInternalState`, `getInternalState`, `invokeMethod`, `getField`, `getMethod`, `invokeConstructor`)
  with plain Java reflection using `java.lang.reflect.Field`, `java.lang.reflect.Method`, and `java.lang.reflect.Constructor`.
tags:
  - testing
  - mockito
recipeList:
  - org.openrewrite.java.testing.mockito.PowerMockWhiteboxSetInternalStateToJavaReflection
  - org.openrewrite.java.testing.mockito.PowerMockWhiteboxGetInternalStateToJavaReflection
  - org.openrewrite.java.testing.mockito.PowerMockWhiteboxInvokeMethodToJavaReflection
  - org.openrewrite.java.testing.mockito.PowerMockWhiteboxGetFieldToJavaReflection
  - org.openrewrite.java.testing.mockito.PowerMockWhiteboxGetMethodToJavaReflection
  - org.openrewrite.java.testing.mockito.PowerMockWhiteboxInvokeConstructorToJavaReflection
