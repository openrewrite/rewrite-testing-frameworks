---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.gatling.UpgradeToGatling3_16
displayName: Upgrade Gatling to 3.16
description: >-
  Upgrade Gatling 3.x simulations written in Scala, Java or Kotlin to Gatling 3.16, following the upgrade guides from
  3.0 onward. Changes needing a judgement call are left alone: Gatling 3.10 requires Java 11,
  `gatling-maven-plugin` 4 no longer compiles Scala so Maven projects with Scala simulations need the
  `scala-maven-plugin`, and JMS moved to `jakarta.jms` in 3.14. The `${}` Expression Language in `ElFileBody`
  template files is not rewritten either.
preconditions:
  - org.openrewrite.Singleton
tags:
  - testing
  - gatling
recipeList:
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: io.gatling.highcharts
      artifactId: gatling-charts-highcharts
      newVersion: 3.16.x
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: io.gatling
      artifactId: gatling-*
      newVersion: 3.16.x
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: io.gatling
      artifactId: gatling-maven-plugin
      newVersion: 4.x
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: io.gatling.gradle
      newVersion: 3.16.x
  # Deprecated in 3.7 and no longer interpreted as of 3.11
  - org.openrewrite.java.testing.gatling.ReplaceGatlingDollarExpressionLanguage
  - org.openrewrite.java.testing.gatling.MigrateGatlingScalaDsl
  # Recommended since 3.5 moved to Scala 2.13
  - org.openrewrite.java.testing.gatling.ReplaceScalaPostfixDurations
  # Java SDK, introduced in 3.7
  - org.openrewrite.java.testing.gatling.MigrateGatlingExitBlockOnFail
  - org.openrewrite.java.testing.gatling.MigrateGatlingChoice
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.gatling.javaapi.core..* stopInjector(..)
      newMethodName: stopLoadGenerator
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.gatling.javaapi.core..* stopInjectorIf(..)
      newMethodName: stopLoadGeneratorIf
      matchOverrides: true
