---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.junit4.JUnit3to4Migration
displayName: JUnit 4 migration from JUnit 3
description: >-
  Migrates JUnit 3 tests to JUnit 4. Test classes that extend `junit.framework.TestCase` get JUnit 4 annotations,
  their assertions move to `org.junit.Assert`, `junit:junit` is upgraded to 4.13.x, and a Maven exclusion of Hamcrest from it is removed.
  Classes that would behave differently under JUnit 4 are left as they are, and listed in a data table;
  JUnit 4 still runs those through its JUnit 3 adapter.
tags:
  - testing
  - junit
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.testing.junit4.MigrateJUnit3TestCase
  - org.openrewrite.java.testing.junit4.MigrateJUnit3Assertions
  - org.openrewrite.java.testing.junit4.UpgradeJUnit3Dependency
  # a build that only had JUnit 3 transitively has no org.junit to compile the migrated tests against
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: junit
      artifactId: junit
      version: 4.13.x
      onlyIfUsing: org.junit.*
      scope: test
  # JUnit 4.13 ships both, and a file that imports the members of both has ambiguous calls
  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: org.junit.matchers.JUnitMatchers containsString(..)
      fullyQualifiedTargetTypeName: org.hamcrest.CoreMatchers
  # JUnit 3 tests did not need Hamcrest, but the JUnit 4 runner does
  - org.openrewrite.maven.RemoveExclusion:
      groupId: junit
      artifactId: junit
      exclusionGroupId: org.hamcrest
      exclusionArtifactId: hamcrest-core
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.junit4.UpgradeJUnit3Dependency
displayName: Upgrade `junit:junit` to 4.13.x
description: >-
  Upgrades the `junit:junit` dependency of Maven and Gradle builds to JUnit 4.13.x. That is what the migrated tests use,
  for rules such as `TestName` that older versions lack, and it includes the `junit.framework` classes for JUnit 3 tests that are not migrated.
tags:
  - testing
  - junit
recipeList:
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: junit
      artifactId: junit
      newVersion: 4.13.x
      overrideManagedVersion: true
