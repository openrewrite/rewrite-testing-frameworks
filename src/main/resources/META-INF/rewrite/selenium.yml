type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.selenium.ReplaceSeleniumServerWithSeleniumJava
displayName: Depend on `selenium-java` instead of `selenium-server`
description: >-
  Selenium 4 publishes no `selenium-server` or `selenium-server-standalone` release for clients, which used either of
  them to get every driver at once. Depend on `selenium-java` instead, or drop the server where the module already
  depends on `selenium-java`. Use it together with `ModuleUsesSeleniumServer` to leave modules alone whose code uses
  the Selenium Grid or server classes.
tags:
  - testing
  - selenium
recipeList:
  - org.openrewrite.java.testing.selenium.RemoveSeleniumServerBesideSeleniumJava
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.seleniumhq.selenium
      oldArtifactId: selenium-server
      newArtifactId: selenium-java
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.seleniumhq.selenium
      oldArtifactId: selenium-server-standalone
      newArtifactId: selenium-java

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.selenium.RemoveSeleniumServerBesideSeleniumJava
displayName: Remove `selenium-server` where `selenium-java` is a dependency
description: Remove `selenium-server` and `selenium-server-standalone` from a module that already depends on `selenium-java`.
