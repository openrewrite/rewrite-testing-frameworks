  - testing
  - selenium
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.internal.WrapsElement
      newFullyQualifiedTypeName: org.openqa.selenium.WrapsElement
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.internal.WrapsDriver
      newFullyQualifiedTypeName: org.openqa.selenium.WrapsDriver
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.internal.Locatable
      newFullyQualifiedTypeName: org.openqa.selenium.interactions.Locatable
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.interactions.internal.Locatable
      newFullyQualifiedTypeName: org.openqa.selenium.interactions.Locatable
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.interactions.internal.Coordinates
      newFullyQualifiedTypeName: org.openqa.selenium.interactions.Coordinates
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.internal.BuildInfo
      newFullyQualifiedTypeName: org.openqa.selenium.BuildInfo
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.ElementNotVisibleException
      newFullyQualifiedTypeName: org.openqa.selenium.ElementNotInteractableException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.ElementNotSelectableException
      newFullyQualifiedTypeName: org.openqa.selenium.InvalidElementStateException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.openqa.selenium.remote.SessionNotFoundException
      newFullyQualifiedTypeName: org.openqa.selenium.NoSuchSessionException

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.selenium.MigrateCapabilityTypeConstants
displayName: Use the W3C names of renamed `CapabilityType` constants
description: >-
  Selenium 4 removed the `CapabilityType` constants for capability names that are not W3C names, and refuses to start
  a session with such a name. Where W3C defines the same capability under another name, use that one. Logging
  preferences, which Chrome only reads as `goog:loggingPrefs`, are set under that name. The constants without a W3C
  equivalent are replaced by the names they held.
tags:
  - testing
  - selenium
recipeList:
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.openqa.selenium.remote.CapabilityType.PLATFORM
      fullyQualifiedConstantName: org.openqa.selenium.remote.CapabilityType.PLATFORM_NAME
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.openqa.selenium.remote.CapabilityType.VERSION
      fullyQualifiedConstantName: org.openqa.selenium.remote.CapabilityType.BROWSER_VERSION
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.openqa.selenium.remote.CapabilityType.ACCEPT_SSL_CERTS
      fullyQualifiedConstantName: org.openqa.selenium.remote.CapabilityType.ACCEPT_INSECURE_CERTS
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.openqa.selenium.remote.CapabilityType.UNEXPECTED_ALERT_BEHAVIOUR
      fullyQualifiedConstantName: org.openqa.selenium.remote.CapabilityType.UNHANDLED_PROMPT_BEHAVIOUR
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: org.openqa.selenium.remote.CapabilityType.PAGE_LOADING_STRATEGY
      fullyQualifiedConstantName: org.openqa.selenium.remote.CapabilityType.PAGE_LOAD_STRATEGY
  # The name `ChromeOptions.LOGGING_PREFS` holds, without depending on the Chrome driver as that constant would
  - org.openrewrite.java.ReplaceConstant:
      owningType: org.openqa.selenium.remote.CapabilityType
      constantName: LOGGING_PREFS
      literalValue: '"goog:loggingPrefs"'
  # Removed without a W3C equivalent: inlined, so that `MigrateLegacyCapabilities` can stop setting them
  - org.openrewrite.java.ReplaceConstant:
      owningType: org.openqa.selenium.remote.CapabilityType
      constantName: SUPPORTS_JAVASCRIPT
      literalValue: '"javascriptEnabled"'
  - org.openrewrite.java.ReplaceConstant:
      owningType: org.openqa.selenium.remote.CapabilityType
      constantName: TAKES_SCREENSHOT
      literalValue: '"takesScreenshot"'
  - org.openrewrite.java.ReplaceConstant:
      owningType: org.openqa.selenium.remote.CapabilityType
      constantName: SUPPORTS_ALERTS
      literalValue: '"handlesAlerts"'
  - org.openrewrite.java.ReplaceConstant:
      owningType: org.openqa.selenium.remote.CapabilityType
      constantName: SUPPORTS_SQL_DATABASE
      literalValue: '"databaseEnabled"'
  - org.openrewrite.java.ReplaceConstant:
      owningType: org.openqa.selenium.remote.CapabilityType
      constantName: SUPPORTS_LOCATION_CONTEXT
      literalValue: '"locationContextEnabled"'
