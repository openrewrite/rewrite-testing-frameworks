---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.selenium.Selenium3to4Migration
displayName: Migrate to Selenium 4
description: >-
  Migrate Selenium 2.x and 3.x code to Selenium 4. A repository whose oldest Java version is 11 or later moves to
  the latest Selenium 4.x, and one on an older Java to 4.13.0, the last release that runs on Java 8. The APIs that
  Selenium 4 removed are replaced: timeouts given as a `long` and a `TimeUnit` take a `java.time.Duration`,
  `findElementBy*` methods become `findElement(By)`, the browser factories of `DesiredCapabilities` and the driver
  constructors taking `Capabilities` move to the browser's options, and relocated types move to their new packages.
  Selenium 4 refuses to start a session with a capability that is not a W3C name, so legacy capability names move to
  their W3C names, and those that have none, which a W3C driver already ignored under Selenium 3, are no longer set.
  Modules on Appium `java-client` before 8, Selenide before 6, Arquillian Drone or Graphene before 3, or Vaadin
  TestBench before 8 are left alone, as those versions only run on Selenium 3 and have to be upgraded together with
  it. So are modules whose code uses the Selenium Grid or server classes of Selenium 3, which Selenium 4 replaced.
tags:
  - testing
  - selenium
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: io.appium
      artifactIdPattern: java-client
      version: "[1,8)"
      invertMarking: true
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: com.codeborne
      artifactIdPattern: selenide*
      version: "[1,6)"
      invertMarking: true
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.jboss.arquillian.extension
      artifactIdPattern: arquillian-drone-*
      version: "[1,3)"
      invertMarking: true
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.jboss.arquillian.graphene
      artifactIdPattern: graphene-*
      version: "[1,3)"
      invertMarking: true
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: com.vaadin
      artifactIdPattern: vaadin-testbench*
      version: "[1,8)"
      invertMarking: true
  - org.openrewrite.java.testing.selenium.ModuleUsesSeleniumServer:
      invertMarking: true
recipeList:
  - org.openrewrite.java.testing.selenium.UpgradeSeleniumDependencies
  - org.openrewrite.java.testing.selenium.Selenium4RelocatedTypes
  - org.openrewrite.java.testing.selenium.MigrateCapabilityTypeConstants
  - org.openrewrite.java.testing.selenium.ReplaceBrowserTypeConstants
  - org.openrewrite.java.testing.selenium.MigrateLegacyCapabilities
  - org.openrewrite.java.testing.selenium.MigrateTimeoutsToDuration
  - org.openrewrite.java.testing.selenium.MigrateWebDriverWaitConstructors
  - org.openrewrite.java.testing.selenium.ReplaceFluentWaitUntilPredicate
  - org.openrewrite.java.testing.selenium.ExtendAbstractWebDriverEventListener
  - org.openrewrite.java.testing.selenium.ReplaceFindElementByMethods
  - org.openrewrite.java.testing.selenium.ReplaceDesiredCapabilitiesFactories
  - org.openrewrite.java.testing.selenium.ReplaceDriverCapabilitiesConstructors
  - org.openrewrite.java.testing.selenium.ReplaceSetHeadless
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.openqa.selenium.Capabilities getVersion()
      newMethodName: getBrowserVersion
      matchOverrides: true
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: org.openqa.selenium.Capabilities getPlatform()
      newMethodName: getPlatformName
      matchOverrides: true

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.selenium.UpgradeSeleniumDependencies
displayName: Upgrade Selenium dependencies to 4.x
description: >-
  Upgrade the Selenium dependencies to the latest Selenium 4.x where the oldest Java version in the repository is 11
  or later, and to 4.13.0, the last release that runs on Java 8, where it is older. A repository whose code uses an
  API that 4.13.0 still has and a later release removed, such as `EventFiringWebDriver` or `FirefoxBinary`, also moves
  to 4.13.0. Artifacts that Selenium 4 no longer publishes are replaced by their successors, or removed where nothing
  uses them.
tags:
  - testing
  - selenium
recipeList:
  - org.openrewrite.java.testing.selenium.UpgradeSeleniumDependenciesToLatest
  - org.openrewrite.java.testing.selenium.UpgradeSeleniumDependenciesTo413
  - org.openrewrite.java.testing.selenium.AddDependenciesSeleniumThreeBroughtAlong

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.selenium.AddDependenciesSeleniumThreeBroughtAlong
displayName: Add the dependencies that Selenium 3 brought along
description: >-
  Selenium 3's `selenium-java` depended on the HtmlUnit and PhantomJS drivers and on Commons IO, and its remote driver
  on OkHttp, Apache HttpClient, Gson and Commons Exec, none of which the latest Selenium 4 brings along. Declare those
  of them that a module using Selenium needs for its own code, where nothing else brings them.
tags:
  - testing
  - selenium
preconditions:
  - org.openrewrite.java.search.ModuleUsesType:
      fullyQualifiedTypeName: org.openqa.selenium..*
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.seleniumhq.selenium
      artifactId: htmlunit-driver
      version: 4.13.0
      onlyIfUsing: org.openqa.selenium.htmlunit..*
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.seleniumhq.selenium
      artifactId: htmlunit-driver
      version: 4.13.0
      onlyIfUsing: com.gargoylesoftware.htmlunit..*
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: com.codeborne
      artifactId: phantomjsdriver
      version: 1.5.0
      onlyIfUsing: org.openqa.selenium.phantomjs..*
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: commons-io
      artifactId: commons-io
      version: 2.x
      onlyIfUsing: org.apache.commons.io..*
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: com.squareup.okhttp3
      artifactId: okhttp
      version: 3.x
      onlyIfUsing: okhttp3..*
      acceptTransitive: true
  # HttpClient brings HttpCore, Commons Codec and Commons Logging, so it comes before them
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.apache.httpcomponents
      artifactId: httpclient
      version: 4.5.x
      onlyIfUsing: org.apache.http..*
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: commons-codec
      artifactId: commons-codec
      version: 1.x
      onlyIfUsing: org.apache.commons.codec..*
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: commons-logging
      artifactId: commons-logging
      version: 1.x
      onlyIfUsing: org.apache.commons.logging..*
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: com.google.code.gson
      artifactId: gson
      version: 2.x
      onlyIfUsing: com.google.gson..*
      acceptTransitive: true
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.apache.commons
      artifactId: commons-exec
      version: 1.x
      onlyIfUsing: org.apache.commons.exec..*
      acceptTransitive: true

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.selenium.UpgradeSeleniumDependenciesToLatest
displayName: Upgrade Selenium dependencies to the latest 4.x
description: >-
  Upgrade the Selenium dependencies to the latest Selenium 4.x, which requires Java 11, in a repository whose oldest
  Java version is 11 or later and whose code uses none of the APIs that releases after 4.13.0 removed.
tags:
  - testing
  - selenium
preconditions:
  - org.openrewrite.java.testing.selenium.StaysOnSelenium413:
      invertMarking: true
recipeList:
  - org.openrewrite.java.testing.selenium.ReplaceRemovedSeleniumArtifacts
  # Arquillian's Selenium BOM ends at 3.4.0, and Selenium's own manages the same artifacts from Selenium 4 on
  - org.openrewrite.maven.ChangeManagedDependencyGroupIdAndArtifactId:
      oldGroupId: org.jboss.arquillian.selenium
      oldArtifactId: selenium-bom
      newGroupId: org.seleniumhq.selenium
      newArtifactId: selenium-bom
      newVersion: 4.x
  # A version that a parent such as Spring Boot's manages is upgraded where the parent sets it, so that the
  # Selenium artifacts the parent manages move along with the ones the module declares
  - org.openrewrite.maven.RemoveRedundantDependencyVersions:
      groupPattern: org.seleniumhq.selenium
      artifactPattern: selenium-*
      onlyIfManagedVersionIs: ANY
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.seleniumhq.selenium
      artifactId: selenium-*
      newVersion: 4.x
      overrideManagedVersion: true
  - org.openrewrite.java.testing.selenium.AddLatestSeleniumRemoteDriverForPhantomJsDriver
  - org.openrewrite.java.testing.selenium.UpgradeTransitiveSeleniumDependenciesToLatest

