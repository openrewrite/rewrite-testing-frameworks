  whose oldest Java version is older than 11, or whose code uses an API that a later release removed.
tags:
  - testing
  - selenium
preconditions:
  - org.openrewrite.java.testing.selenium.StaysOnSelenium413
recipeList:
  - org.openrewrite.java.testing.selenium.ReplaceRemovedSeleniumArtifacts
  # Arquillian's Selenium BOM ends at 3.4.0, and Selenium's own manages the same artifacts from Selenium 4 on
  - org.openrewrite.maven.ChangeManagedDependencyGroupIdAndArtifactId:
      oldGroupId: org.jboss.arquillian.selenium
      oldArtifactId: selenium-bom
      newGroupId: org.seleniumhq.selenium
      newArtifactId: selenium-bom
      newVersion: 4.13.x
  # A version that a parent such as Spring Boot's manages is upgraded where the parent sets it, so that the
  # Selenium artifacts the parent manages move along with the ones the module declares
  - org.openrewrite.maven.RemoveRedundantDependencyVersions:
      groupPattern: org.seleniumhq.selenium
      artifactPattern: selenium-*
      onlyIfManagedVersionIs: ANY
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.seleniumhq.selenium
      artifactId: selenium-*
      newVersion: 4.13.x
      overrideManagedVersion: true
  - org.openrewrite.java.testing.selenium.AddSelenium413RemoteDriverForPhantomJsDriver
  - org.openrewrite.java.testing.selenium.UpgradeTransitiveSeleniumDependenciesTo413

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.selenium.ReplaceRemovedSeleniumArtifacts
displayName: Replace Selenium artifacts that Selenium 4 no longer publishes
description: >-
  Depend on `selenium-java` instead of `selenium-server` or `selenium-server-standalone`, which Selenium 4 does not
  publish for clients. Move the HtmlUnit driver to `htmlunit-driver` 4.13.0, which keeps HtmlUnit 2.x and so the `com.gargoylesoftware`
  packages and runs on both Java 8 and the latest Selenium 4. Move the PhantomJS driver to
  `com.codeborne:phantomjsdriver` 1.5.0, the only release built for Selenium 4, and remove the drivers for
  Opera, iPhone and Android, which Selenium 4 no longer publishes, where nothing uses them.
tags:
  - testing
  - selenium
recipeList:
  - org.openrewrite.java.testing.selenium.ReplaceSeleniumServerWithSeleniumJava
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.seleniumhq.selenium
      oldArtifactId: selenium-htmlunit-driver
      newArtifactId: htmlunit-driver
      newVersion: 4.13.0
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.seleniumhq.selenium
      artifactId: htmlunit-driver
      newVersion: 4.13.0
      overrideManagedVersion: true
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.github.detro
      oldArtifactId: phantomjsdriver
      newGroupId: com.codeborne
      newVersion: 1.5.0
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: com.github.detro.ghostdriver
      oldArtifactId: phantomjsdriver
      newGroupId: com.codeborne
      newVersion: 1.5.0
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: com.codeborne
      artifactId: phantomjsdriver
      newVersion: 1.5.0
      overrideManagedVersion: true
  - org.openrewrite.java.dependencies.RemoveDependency:
      groupId: org.seleniumhq.selenium
      artifactId: selenium-opera-driver
      unlessUsing: org.openqa.selenium.opera..*
  - org.openrewrite.java.dependencies.RemoveDependency:
      groupId: org.seleniumhq.selenium
      artifactId: selenium-iphone-driver
      unlessUsing: org.openqa.selenium.iphone..*
  - org.openrewrite.java.dependencies.RemoveDependency:
      groupId: org.seleniumhq.selenium
      artifactId: selenium-android-driver
      unlessUsing: org.openqa.selenium.android..*

