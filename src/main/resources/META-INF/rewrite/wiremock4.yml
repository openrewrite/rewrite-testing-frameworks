---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.wiremock.Wiremock3to4Migration
displayName: Upgrade WireMock to 4.x
description: >-
  Upgrade WireMock to 4.x, which requires Java 17, ships Jetty 12.1 by default, splits JUnit support out
  into separate modules and makes the primary domain classes immutable. Note that `RequestMethod.GET_OR_HEAD`
  is a multi method matcher in 4.x rather than a method named `GET_OR_HEAD`, so code reading a name off that
  particular constant needs a look.
preconditions:
  - org.openrewrite.Singleton
tags:
  - testing
  - wiremock
recipeList:
  # These two only hold while the module is still on 3.x, so they run before the version is bumped
  - org.openrewrite.java.testing.wiremock.RemoveDuplicateContentTypeHeader
  - org.openrewrite.java.testing.wiremock.RemoveDuplicateContentTypeStubHeader
  - org.openrewrite.java.testing.wiremock.UpgradeWiremockDependencyVersion
  # 4.x dropped the separate Jetty 12 distribution; Jetty 12.1 is now the default in `wiremock`
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.wiremock
      oldArtifactId: wiremock-jetty12
      newGroupId: org.wiremock
      newArtifactId: wiremock
      newVersion: 4.0.0-beta.38
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.wiremock
      artifactId: wiremock
      newVersion: 4.0.0-beta.38
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.wiremock
      artifactId: wiremock-standalone
      newVersion: 4.0.0-beta.38
  # JUnit 4 and JUnit 5 support moved out of `wiremock` into modules that are not transitive
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.wiremock
      artifactId: wiremock-junit5
      version: 4.0.0-beta.38
      onlyIfUsing: com.github.tomakehurst.wiremock.junit5.*
      scope: test
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.wiremock
      artifactId: wiremock-junit4
      version: 4.0.0-beta.38
      onlyIfUsing: com.github.tomakehurst.wiremock.junit.WireMock*Rule
      scope: test
  # `jetty-client`, `jetty-proxy`, `jetty-xml` and `jetty-webapp` are no longer transitive either
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.eclipse.jetty
      oldArtifactId: jetty-servlet
      newGroupId: org.eclipse.jetty.ee10
      newArtifactId: jetty-ee10-servlet
      newVersion: 12.1.x
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.eclipse.jetty
      oldArtifactId: jetty-servlets
      newGroupId: org.eclipse.jetty.ee10
      newArtifactId: jetty-ee10-servlets
      newVersion: 12.1.x
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.eclipse.jetty
      artifactId: jetty-client
      version: 12.1.x
      onlyIfUsing: org.eclipse.jetty.client.*
      scope: test
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.eclipse.jetty
      artifactId: jetty-proxy
      version: 12.1.x
      onlyIfUsing: org.eclipse.jetty.proxy.*
      scope: test
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.eclipse.jetty
      artifactId: jetty-xml
      version: 12.1.x
      onlyIfUsing: org.eclipse.jetty.xml.*
      scope: test
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.eclipse.jetty.ee10
      artifactId: jetty-ee10-webapp
      version: 12.1.x
      onlyIfUsing: org.eclipse.jetty.ee10.webapp.*
      scope: test
  - org.openrewrite.java.testing.wiremock.MigrateWiremockRepackagedTypes
  - org.openrewrite.java.testing.wiremock.ReplaceRemovedConstructors
  - org.openrewrite.java.testing.wiremock.ReplaceSettersWithTransform
  - org.openrewrite.java.testing.wiremock.MigrateStubMappingUuidToId
  - org.openrewrite.java.testing.wiremock.MigrateContentTypeHeaderCharset
  - org.openrewrite.java.testing.wiremock.MigrateRequestMethodIsOneOf
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.github.tomakehurst.wiremock.stubbing.StubMapping getUuid()
      newMethodName: getId
  # `value()` widened its return type to `Object` so that the multi method patterns can serialise as
  # something other than a string; `getName()` still hands back the same name as a `String`
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: com.github.tomakehurst.wiremock.http.RequestMethod value()
      newMethodName: getName
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.wiremock.MigrateWiremockRepackagedTypes
