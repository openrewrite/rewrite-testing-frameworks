---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.testing.sonar.SonarRules
displayName: Sonar rules for testing frameworks
description: Fixes or flags code reported by SonarQube Java rules, grouped by the default Sonar severity of each rule.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.FindSourceFiles:
      filePattern: "**/*.java"
recipeList:
  - org.openrewrite.java.testing.sonar.Blocker
  - org.openrewrite.java.testing.sonar.Critical
  - org.openrewrite.java.testing.sonar.Major
  - org.openrewrite.java.testing.sonar.Minor
  - org.openrewrite.java.testing.sonar.Info
---
